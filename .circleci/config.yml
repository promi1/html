version: 2.1

jobs:
  lint-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install package + dev deps
          command: |
            python -m pip install --upgrade pip
            pip install -e .[dev]
      - run:
          name: Ruff lint
          command: ruff check src/ tests/
      - run:
          name: Pytest
          command: pytest -q

workflows:
  ci:
    jobs:
      - lint-and-test
